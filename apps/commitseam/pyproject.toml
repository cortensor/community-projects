[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commitseam"
version = "0.1.0"
description = "Exactly-once local SQLite rerun queue ledger and crash-seam harness for OpenMinion 0.1.24"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "openminion==0.1.24",
  "pydantic>=2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
]

[project.scripts]
commitseam = "commitseam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
commitseam = ["fixtures/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
