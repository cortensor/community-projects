[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-watch"
version = "0.1.0"
description = "Paper Deadline Watch: deadline reminders + multi-source research briefs for CCF venues (Cortensor Hackathon #5)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ValeriaWong" }]
dependencies = [
    "openminion==0.1.21",
    "pydantic>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.scripts]
paper-watch = "paper_watch.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
