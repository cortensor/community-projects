[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortensor-agent-eval"
version = "0.1.0"
description = "Deterministic multi-agent evaluator and benchmark suite for OpenMinion 0.1.24 workflows and Cortensor endpoints"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "openminion==0.1.24",
    "pydantic>=2.0",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cortensor-eval = "cortensor_agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
