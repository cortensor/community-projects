[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortensor-release-gate"
version = "0.1.0"
description = "OpenMinion 0.1 release and submission QA gate agent for Cortensor community projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "openminion==0.1.23",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.11",
]

[project.scripts]
cortensor-release-gate = "cortensor_release_gate.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_decorators = false
warn_unused_ignores = true
packages = ["cortensor_release_gate"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml", "openminion", "openminion.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
