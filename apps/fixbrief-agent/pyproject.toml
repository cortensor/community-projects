[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixbrief-agent"
version = "0.1.0"
description = "Multilingual repair-brief agent built on the OpenMinion 0.1 Python SDK (Cortensor Hackathon #5)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Emilio Tecnologías" }]
dependencies = [
    "openminion==0.1.24",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fixbrief = "fixbrief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
