[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortensor-route-bench"
version = "0.1.0"
description = "OpenMinion 0.1 SDK building-block probe suite, Cortensor route preflight inspector, and multi-agent PoI-style consensus verifier."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "ixroo" }
]
dependencies = [
  "openminion>=0.1.23",
  "pydantic>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
cortensor-route-bench = "cortensor_route_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
