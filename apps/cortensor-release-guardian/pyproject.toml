[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortensor-release-guardian"
version = "0.1.0"
description = "An OpenMinion 0.1 Python SDK release & repository readiness audit agent for Cortensor builders."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "openminion>=0.1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
release-guardian = "release_guardian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
