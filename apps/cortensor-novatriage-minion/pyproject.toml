[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortensor-novatriage-minion"
version = "0.1.0"
description = "NovaTriage Minion: autonomous multi-step Web3 token, Solidity & x402 risk triage agent built on OpenMinion 0.1"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "z121245017-ai" }]
keywords = ["cortensor", "openminion", "web3", "solidity", "security", "x402", "agent"]
dependencies = [
  "openminion==0.1.24",
  "httpx[socks]>=0.27,<1",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
novatriage-minion = "novatriage_minion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: live network checks against public DexScreener/GoPlus/Cloud Run x402 endpoints",
]
