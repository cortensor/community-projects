[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackathon-watch"
version = "0.1.0"
description = "Hackathon Watch agent for Cortensor Hackathon #5 — watch public hackathon lists, spot newly listed events, and give a preliminary suitability call for Allen's free-only, online-first, LLM/Agent profile."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ValeriaWong" }]
dependencies = [
    "openminion==0.1.21",
    "pydantic>=2.9",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hackathon-watch = "hackathon_watch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
