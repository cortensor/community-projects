[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "release-guard-minion"
version = "0.2.0"
description = "Inspectable, permission-gated repository release readiness auditor built on OpenMinion 0.1"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "openminion>=0.1.24",
  "pydantic>=2",
]

[project.scripts]
release-guard = "release_guard_minion.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
