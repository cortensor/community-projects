[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openminion-triage-agent"
version = "0.1.0"
description = "Offline-testable GitHub issue and release triage agent built on OpenMinion 0.1"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openminion>=0.1.24",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
packages = ["triage_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

