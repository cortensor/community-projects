[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-triage"
version = "0.1.2"
description = "Single-issue deep triage agent for Cortensor Hackathon #5 — route an issue to a person/queue with confidence and reasons."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ValeriaWong" }]
dependencies = [
    "openminion==0.1.21",
    "pydantic>=2.9",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
issue-triage = "issue_triage.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
